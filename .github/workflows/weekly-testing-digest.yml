name: Weekly Testing Digest

on:
    schedule:
        # Every Monday at 9:00 UTC
        - cron: '0 9 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    digest:
        name: Collect and post testing digest
        runs-on: ubuntu-latest
        env:
            SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEEKLY_TESTING_DIGEST_WEBHOOK_URL }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: .github/scripts/package.json

            - name: Install dependencies
              run: npm install
              working-directory: .github/scripts

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ runner.os }}-${{ hashFiles('.github/scripts/package.json') }}

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium --with-deps
              working-directory: .github/scripts

            - name: Install Playwright system deps (cached browsers)
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium
              working-directory: .github/scripts

            - name: Collect and post testing digest
              run: node weekly-testing-digest.mjs
              working-directory: .github/scripts
